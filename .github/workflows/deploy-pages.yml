name: Deploy GitHub Pages branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-branch
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build -- --base "/${{ github.event.repository.name }}/"

      - name: Publish page branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          # GITHUB_TOKEN pushes do not trigger branch-based Pages builds.
          personal_token: ${{ secrets.PAGES_TOKEN }}
          publish_branch: page
          publish_dir: ./dist
